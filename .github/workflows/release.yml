# Soqucoin Release Build Workflow
# Automatically builds and releases binaries for all platforms on tagged releases

name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.21.0)'
        required: true
        default: 'v1.0.0-rc1'

env:
  MAKEFLAGS: -j4

permissions:
  contents: write

jobs:
  # ============================================
  # Linux x86_64 Build
  # ============================================
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 libssl-dev \
            libevent-dev libboost-all-dev libminiupnpc-dev \
            libzmq3-dev libsqlite3-dev libdb++-dev
      
      - name: Build
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench
          make $MAKEFLAGS
      
      - name: Verify binary
        run: |
          file src/.libs/soqucoind | grep -q "x86-64" && echo "✅ soqucoind is x86-64" || (echo "❌ Wrong architecture" && exit 1)

      - name: Package
        run: |
          mkdir -p dist
          cp src/.libs/soqucoind src/.libs/soqucoin-cli dist/
          tar -czvf soqucoin-${{ github.ref_name }}-linux-x64.tar.gz -C dist .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soqucoin-linux-x64
          path: soqucoin-*-linux-x64.tar.gz

  # ============================================
  # Linux ARM64 Build (cross-compile from x64)
  # ============================================
  build-linux-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Set up ARM64 multiarch
        run: |
          # Step 1: Add ARM64 architecture FIRST
          sudo dpkg --add-architecture arm64
          
          # Step 2: Pin existing sources to amd64 only
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          
          # Step 3: Add ARM64 package sources (Ubuntu ports)
          echo "deb [arch=arm64] http://ports.ubuntu.com/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list

          # Step 4: Update package lists with new architecture
          sudo apt-get update

      - name: Install build tools and cross-compiler
        run: |
          # Native build tools (run on x64)
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 \
            g++-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Install ARM64 cross-libraries
        run: |
          # ARM64 target libraries (linked into the ARM64 binary)
          sudo apt-get install -y \
            libssl-dev:arm64 \
            libevent-dev:arm64 \
            libboost-system-dev:arm64 \
            libboost-filesystem-dev:arm64 \
            libboost-thread-dev:arm64 \
            libboost-chrono-dev:arm64 \
            libboost-program-options-dev:arm64 \
            libdb++-dev:arm64
      
      - name: Build (cross-compile)
        run: |
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench --disable-wallet \
            --disable-zmq --without-miniupnpc \
            --host=aarch64-linux-gnu \
            --with-boost-libdir=/usr/lib/aarch64-linux-gnu \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib \
            STRIP=aarch64-linux-gnu-strip \
            PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
            PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig \
            CPPFLAGS="-I/usr/aarch64-linux-gnu/include" \
            LDFLAGS="-L/usr/aarch64-linux-gnu/lib"
          make $MAKEFLAGS
      
      - name: Verify binary architecture
        run: |
          file src/.libs/soqucoind | grep -q "aarch64" && echo "✅ soqucoind is ARM64" || (echo "❌ Wrong architecture" && exit 1)
          file src/.libs/soqucoin-cli | grep -q "aarch64" && echo "✅ soqucoin-cli is ARM64" || (echo "❌ Wrong architecture" && exit 1)

      - name: Package
        run: |
          mkdir -p dist
          cp src/.libs/soqucoind src/.libs/soqucoin-cli dist/
          tar -czvf soqucoin-${{ github.ref_name }}-linux-arm64.tar.gz -C dist .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soqucoin-linux-arm64
          path: soqucoin-*-linux-arm64.tar.gz

  # ============================================
  # macOS Builds (Apple Silicon and Intel)
  # Each architecture builds on a runner of that architecture. The binaries
  # link Homebrew's static archives and load only system libraries, so they
  # run on a Mac without Homebrew from macOS version macos_min.
  # ============================================
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            macos_min: '15.0'
            asset: macos-arm64
          - arch: x86_64
            runner: macos-15-intel
            macos_min: '15.0'
            asset: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install automake libtool boost miniupnpc openssl@3 pkg-config libevent zeromq libsodium

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run: |
          set -o pipefail
          # Each Homebrew lib directory holds a .dylib beside the .a and the
          # linker takes the .dylib, so link from a directory of archives only.
          static_libs="$RUNNER_TEMP/static-libs"
          mkdir -p "$static_libs"
          for formula in boost openssl@3 libevent zeromq miniupnpc libsodium; do
            ln -s "$(brew --prefix "$formula")"/lib/*.a "$static_libs"/
          done
          ./autogen.sh
          # --disable-shared links the in-tree univalue into the binaries.
          # libzmq.a calls libsodium, which nothing else names.
          ./configure --without-gui --disable-tests --disable-bench --disable-wallet --disable-shared \
            --with-boost="$(brew --prefix)" --with-boost-libdir="$static_libs" \
            LDFLAGS="-L$static_libs" \
            CPPFLAGS="-I$(brew --prefix)/include -I$(brew --prefix openssl@3)/include" \
            LIBS="-lsodium"
          make $MAKEFLAGS 2>&1 | tee build.log
          # The linker only warns when an archive needs a newer macOS than
          # the deployment target.
          if grep -m 5 'built for newer' build.log; then
            echo "an archive needs a newer macOS than $MACOSX_DEPLOYMENT_TARGET" >&2
            exit 1
          fi

      - name: Verify binaries
        run: |
          .github/scripts/check-macos-release.sh ${{ matrix.arch }} ${{ matrix.macos_min }} \
            src/soqucoind src/soqucoin-cli
          # configure builds without UPnP, and gives no warning, when it
          # cannot find miniupnpc; ZMQ is left out only by --disable-zmq.
          for opt in -upnp -zmqpubhashblock; do
            if ! src/soqucoind -help | grep -q -- "$opt"; then
              echo "soqucoind -help does not list $opt" >&2
              exit 1
            fi
          done
          # libsodium.a defines randombytes too, and the static link keeps
          # whichever definition it loads first. The daemon must keep the
          # node's own (src/pat/randombytes.cpp), which ML-DSA key generation
          # and signing call and which calls GetStrongRandBytes. Read the
          # function's instruction lines, from its address to the next
          # symbol's. nm and otool print addresses as 16 lowercase hex digits,
          # so string order is address order; awk would compare two that look
          # like numbers (0000000100100998, 00000001001009e0) as numbers, so
          # "" is appended to each to make it a string.
          if ! read -r _ end < <(nm -n src/soqucoind \
              | awk '$3 == "_randombytes" {s = $1; next} s != "" && $1 "" != s "" {print s, $1; exit}'); then
            echo "nm found no _randombytes in soqucoind, or no symbol after it" >&2
            exit 1
          fi
          if ! otool -tV -p _randombytes src/soqucoind \
              | awk -v end="$end" '$1 !~ /^[0-9a-f]+$/ {next} $1 "" >= end "" {exit} {print}' \
              | grep -q 'GetStrongRandBytes'; then
            echo "soqucoind's randombytes does not call GetStrongRandBytes" >&2
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp src/soqucoind src/soqucoin-cli dist/
          tar -czvf soqucoin-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soqucoin-${{ matrix.asset }}
          path: soqucoin-*-${{ matrix.asset }}.tar.gz

  # ============================================
  # Windows x64 Cross-Compile Build
  # ============================================
  build-windows-x64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 \
            g++-mingw-w64-x86-64 mingw-w64-x86-64-dev \
            curl
      
      - name: Set mingw-w64 to POSIX threading
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
      
      - name: Build depends
        run: |
          make -C depends HOST=x86_64-w64-mingw32 -j4 NO_QT=1
      
      - name: Build
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
            ./configure --prefix=/ --without-gui --disable-tests --disable-bench
          make $MAKEFLAGS
      
      - name: Package
        run: |
          mkdir -p dist
          cp src/.libs/soqucoind.exe src/.libs/soqucoin-cli.exe dist/ 2>/dev/null || \
          cp src/.libs/soqucoind src/.libs/soqucoin-cli dist/ 2>/dev/null || \
          cp src/soqucoind.exe src/soqucoin-cli.exe dist/ 2>/dev/null || \
          cp src/soqucoind src/soqucoin-cli dist/
          cd dist && zip -r ../soqucoin-${{ github.ref_name }}-windows-x64.zip .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soqucoin-windows-x64
          path: soqucoin-*-windows-x64.zip

  # ============================================
  # Create Release with All Artifacts
  # ============================================
  create-release:
    # Only a tag publishes; a workflow_dispatch run from a branch publishes
    # nothing.
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-macos
      - build-windows-x64
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Flatten artifacts
        run: |
          mkdir release
          find . -name "*.tar.gz" -exec mv {} release/ \;
          find . -name "*.zip" -exec mv {} release/ \;
      
      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

